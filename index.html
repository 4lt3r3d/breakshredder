<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BREAKSHREDDER</title>
<link rel="icon" href="data:,">
<!-- Stop dark-mode extensions and the browser's forced dark mode from recolouring the page.
     They re-process every pad in the slice bank, which is slow, and the page has its own colours. -->
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* Light or dark, remembered between visits. Set here, before anything is drawn. */
try { if (localStorage.getItem("breakshredder-theme") === "dark") { document.documentElement.dataset.theme = "dark"; } } catch (e) {}
</script>
<style>
/* ------------------------------------------------------------------
   BREAKSHREDDER - milestone 1 page
   Direction: modern Swedish brutalism, kept quiet.
   THREE colours only: concrete, black, one yellow.
   Dark mode is the same page with concrete and black swapped and red in place of yellow.
   Bahnschrift (DIN, ships with Windows 10). Heavy black rules.
   No radius, no shadow, no gradient, no transitions.
------------------------------------------------------------------- */
:root {
  --ground: #e4e2dc;
  --ink: #000;
  --hi: #ffe500;
  --rule: 4px;
  color-scheme: only light;
  --din: Bahnschrift, "DIN Alternate", "DIN Condensed", "Arial Narrow", sans-serif;
  --mono: "Cascadia Mono", Consolas, "Lucida Console", monospace;
  --screen: #000;          /* behind video and thumbnails: black in both themes */
  --screen-ink: #e4e2dc;
}
:root[data-theme=dark] {
  --ground: #000;
  --ink: #e4e2dc;
  --hi: #d60000;
  color-scheme: only dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--din); font-size: 15px; line-height: 1.25; overflow-x: hidden; }
button, input { font: inherit; color: inherit; border-radius: 0; }
:focus-visible { outline: var(--rule) solid var(--ink); outline-offset: calc(var(--rule) * -1); }
::selection { background: var(--ink); color: var(--ground); }

.small { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.big { font-weight: 700; font-stretch: 75%; letter-spacing: -.02em; text-transform: uppercase; }

/* --- wordmark ---------------------------------------------------- */
.mark { border-bottom: var(--rule) solid var(--ink); overflow: hidden; padding: 0 8px; }
.mark h1 { font-weight: 700; font-stretch: 75%; letter-spacing: -.045em; line-height: .78; white-space: nowrap;
           text-transform: uppercase; font-size: 200px; padding: .1em 0 .04em; display: inline-block; }

/* --- source ------------------------------------------------------ */
.source { display: grid; grid-template-columns: 1fr 200px; border-bottom: var(--rule) solid var(--ink); height: 84px; }
.source input { border: 0; background: transparent; font-size: 34px; font-weight: 600; font-stretch: 85%; padding: 0 16px; min-width: 0; }
.source input::placeholder { color: var(--ink); opacity: .3; text-transform: uppercase; }
.source input:focus { outline: none; }
.source button { border: 0; background: var(--ink); color: var(--ground); font-size: 40px; cursor: pointer; text-align: left; padding: 0 16px; }
.source button:hover { background: var(--hi); color: var(--ink); }
.source button:disabled { opacity: .3; cursor: default; background: var(--ink); color: var(--ground); }

/* --- status line (doubles as the progress bar) ------------------- */
.status { display: grid; grid-template-columns: 1fr 96px; height: 34px; border-bottom: var(--rule) solid var(--ink); }
.status .meter { position: relative; min-width: 0; }
.status button { border: 0; border-left: var(--rule) solid var(--ink); background: var(--ground); cursor: pointer; text-align: left; padding: 0 16px; }
.status button:hover { background: var(--hi); }
.status .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--hi); }
.status .text { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; }

/* --- main: preview + side ---------------------------------------- */
.main { display: grid; grid-template-columns: 70fr 30fr; }
.preview { border-right: var(--rule) solid var(--ink); min-width: 0; }
.screen { position: relative; background: var(--screen); aspect-ratio: 16 / 9; }
.screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; background: var(--screen); }
.screen .empty { position: absolute; left: 16px; bottom: 12px; color: var(--screen-ink); font-size: 64px; line-height: .9; }
.transport { display: grid; grid-template-columns: 130px 230px 1fr; border-top: var(--rule) solid var(--ink); border-bottom: var(--rule) solid var(--ink); height: 60px; }
.transport button { border: 0; border-right: var(--rule) solid var(--ink); background: var(--ground); font-size: 34px; text-align: left; padding: 0 16px; cursor: pointer; }
.transport button:hover, .transport button.on { background: var(--hi); }
.transport button:disabled { opacity: .3; cursor: default; background: var(--ground); }
.transport .time { border-right: var(--rule) solid var(--ink); padding: 0 16px; display: flex; align-items: center; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scrub { position: relative; cursor: pointer; }
.scrub .head { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink); }
.titleline { padding: 12px 16px 28px; font-size: 24px; font-weight: 600; font-stretch: 85%; line-height: 1.05; overflow-wrap: anywhere; }

.side { min-width: 0; }
.block { border-bottom: var(--rule) solid var(--ink); padding: 12px 16px 16px; }
.block:last-child { border-bottom: 0; }
.block > .small { display: block; margin-bottom: 10px; }

.tools { display: flex; flex-wrap: wrap; gap: 4px 14px; font-weight: 700; text-transform: uppercase; }
.tools .bad { background: var(--ink); color: var(--ground); padding: 0 6px; }

.log { font-family: var(--mono); font-size: 12px; line-height: 1.5; height: 220px; overflow-y: auto; margin: 0 -16px; }
.log div { padding: 0 16px; display: grid; grid-template-columns: 70px 1fr; }
.log div.e { background: var(--ink); color: var(--ground); }

.cache { margin: 0 -16px; }
.cache button { display: grid; grid-template-columns: 1fr 56px; gap: 8px; width: 100%; border: 0; background: transparent; text-align: left; padding: 5px 16px; cursor: pointer; font-size: 15px; font-weight: 600; }
.cache button:hover { background: var(--hi); }
.cache button span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.cache .none { padding: 0 16px; opacity: .45; }

/* --- trim + analyze ---------------------------------------------- */
.trim { display: grid; grid-template-columns: 1fr 1fr 110px 200px; border-top: var(--rule) solid var(--ink); height: 60px; }
.trim button { border: 0; border-right: var(--rule) solid var(--ink); background: var(--ground); font-size: 26px; text-align: left; padding: 0 16px; cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap; }
.trim button:last-child { border-right: 0; background: var(--ink); color: var(--ground); font-size: 34px; }
.trim button:hover { background: var(--hi); color: var(--ink); }
.trim button:disabled { opacity: .3; cursor: default; background: var(--ground); color: var(--ink); }
.trim button:last-child:disabled { background: var(--ink); color: var(--ground); }

/* --- slice bank --------------------------------------------------- */
.bank { border-top: var(--rule) solid var(--ink); }
.bankhead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; padding: 12px 16px 10px; }
.bankhead .big { font-size: 40px; line-height: 1; }
.bar { display: flex; flex-wrap: wrap; align-items: stretch; border-top: var(--rule) solid var(--ink); background: var(--ground); }
.bar button { border: 0; border-right: 1px solid var(--ink); background: var(--ground); padding: 9px 12px; cursor: pointer;
              font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.bar button.on { background: var(--ink); color: var(--ground); }
.bar button:hover { background: var(--hi); color: var(--ink); }
.bar button:disabled { opacity: .3; cursor: default; background: var(--ground); color: var(--ink); }
.pager span { padding: 9px 12px; font-variant-numeric: tabular-nums; }
.detail { position: sticky; top: 0; z-index: 2; border-bottom: var(--rule) solid var(--ink); }
.detail .info { flex: 1; min-width: 320px; padding: 9px 16px; font-variant-numeric: tabular-nums; }
.detail button:first-of-type { border-left: 1px solid var(--ink); }

.pads { display: grid; grid-template-columns: repeat(auto-fill, 97px); }
.pad { display: block; width: 97px; border: 0; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
       background: var(--ground); padding: 0; cursor: pointer; text-align: left; }
.pad .th { display: block; width: 96px; height: 54px; background-color: var(--screen); background-image: var(--sprite);
           background-repeat: no-repeat; }
.pad canvas { display: block; width: 96px; height: 22px; }
.pad .lab { display: flex; justify-content: space-between; padding: 2px 5px 3px; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pad:hover .lab { background: var(--hi); }
.pad.locked .lab { background: var(--ink); color: var(--ground); }
.pad.del { opacity: .2; }
.pad.sel { outline: var(--rule) solid var(--hi); outline-offset: calc(var(--rule) * -1); }
.pad.off { display: none; }

/* --- break engine (milestone 3) ----------------------------------- */
.engine { border-top: var(--rule) solid var(--ink); }
.bar label { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-right: 1px solid var(--ink);
             font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.bar input[type=number] { width: 86px; border: 0; background: transparent; font-size: 17px; font-weight: 700; letter-spacing: 0; padding: 6px 0; }
.bar input[type=number]:focus { outline: none; background: var(--hi); color: var(--ink); }
.ops { display: grid; grid-template-columns: repeat(9, 1fr); border-top: var(--rule) solid var(--ink); }
.ops > div { border-right: 1px solid var(--ink); padding: 8px 12px 6px; min-width: 0; }
.ops > div:last-child { border-right: 0; }
.ops.mix { grid-template-columns: repeat(9, 1fr); }
.ops.snd { grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--ink); }
.ops.snd > div:last-child { border-right: 1px solid var(--ink); }
.ops b i { font-style: normal; font-size: 11px; letter-spacing: .1em; margin-left: 3px; }
.bar .note { flex: 1; min-width: 240px; padding: 9px 12px; }
.bar .note + button { border-left: 1px solid var(--ink); }
input[type=range]:disabled { opacity: .3; cursor: default; }
.ops.mix > div:nth-child(3) { border-right: var(--rule) solid var(--ink); }   /* group levels | single instruments */
.ops .row { display: flex; justify-content: space-between; align-items: baseline; }
.ops b { font-size: 24px; font-stretch: 75%; font-variant-numeric: tabular-nums; line-height: 1; }
input[type=range] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 24px; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--ink); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 22px; margin-top: -9px; background: var(--ink); border: 0; border-radius: 0; }
input[type=range]:hover::-webkit-slider-thumb { background: var(--hi); outline: 2px solid var(--ink); }
.bars { display: grid; grid-template-columns: repeat(8, 1fr); border-top: var(--rule) solid var(--ink); }
.barcell { display: block; border: 0; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); background: var(--ground); padding: 0; cursor: pointer; text-align: left; min-width: 0; }
.barcell .bh { display: flex; justify-content: space-between; padding: 3px 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.barcell canvas { display: block; width: 100%; height: 48px; }
.barcell.locked .bh { background: var(--ink); color: var(--ground); }
.barcell.now .bh { background: var(--hi); color: var(--ink); }
.barcell.sel { outline: var(--rule) solid var(--hi); outline-offset: calc(var(--rule) * -1); }

@media (max-width: 1000px) {
  .ops, .ops.mix, .ops.snd { grid-template-columns: repeat(3, 1fr); }
  .ops.mix > div:nth-child(3) { border-right: 0; }
  .bars { grid-template-columns: repeat(4, 1fr); }
  .main { grid-template-columns: 1fr; }
  .preview { border-right: 0; }
  .side { border-top: var(--rule) solid var(--ink); }
}
</style>
</head>
<body>

<div class="mark" id="mark"><h1 id="markText">Breakshredder</h1></div>

<form class="source" id="form" autocomplete="off">
  <input id="url" type="text" placeholder="Paste YouTube link" spellcheck="false" aria-label="YouTube link">
  <button class="big" id="go" type="submit">Fetch</button>
</form>

<div class="status">
  <div class="meter">
    <div class="fill" id="fill"></div>
    <div class="text small"><span id="stage">Idle</span><span id="rate"></span></div>
  </div>
  <button type="button" class="small" id="theme" title="Switch between the light and dark colours"></button>
</div>

<div class="main">
  <section class="preview">
    <div class="screen">
      <video id="vid" preload="metadata" playsinline></video>
      <span class="empty big" id="empty">No source</span>
    </div>
    <div class="transport">
      <button class="big" id="play" type="button" disabled>Play</button>
      <div class="time" id="time">00:00.0 / 00:00</div>
      <div class="scrub" id="scrub"><div class="head" id="head"></div></div>
    </div>
    <div class="titleline" id="title"></div>
    <div class="trim">
      <button class="big" id="setIn" type="button" disabled title="Set the start of the section to analyze to the current position">In 00:00.0</button>
      <button class="big" id="setOut" type="button" disabled title="Set the end of the section to analyze to the current position">Out 00:00.0</button>
      <button class="big" id="clearTrim" type="button" disabled title="Use the whole video">Full</button>
      <button class="big" id="analyze" type="button" disabled>Analyze</button>
    </div>
  </section>

  <aside class="side">
    <div class="block">
      <span class="small">Tools</span>
      <div class="tools" id="tools"></div>
    </div>
    <div class="block">
      <span class="small">Log</span>
      <div class="log" id="log"></div>
    </div>
    <div class="block">
      <span class="small">Cache</span>
      <div class="cache" id="cache"></div>
    </div>
  </aside>
</div>

<section class="engine" id="engine" hidden>
  <div class="bankhead"><span class="big">Break engine</span><span class="small" id="engInfo"></span></div>
  <div class="bar">
    <button type="button" id="engPlay">Play</button>
    <button type="button" id="engGen">Generate</button>
    <label>BPM <input type="number" id="engBpm" min="60" max="300" step="1" value="174"></label>
    <label>Bars <input type="number" id="engBars" min="2" max="64" step="2" value="16"></label>
    <label>Seed <input type="number" id="engSeed" min="0" step="1" value="1" style="width:120px"></label>
    <button type="button" id="engNewSeed">New seed</button>
    <button type="button" id="engForm" class="on" title="Intro, build, drop, interlude, heavier drop, outro. Off = full break in every bar.">Song form</button>
    <button type="button" id="engRegen" disabled>Regenerate bar</button>
    <button type="button" id="engLock" disabled>Lock bar</button>
  </div>
  <div class="bar">
    <label>Export</label>
    <button type="button" class="exp" data-mode="audio" title="The finished mix as a sound file, no picture">Audio only: WAV</button>
    <button type="button" class="exp" data-mode="video" title="The same picture edit with no sound track">Video only: silent MP4</button>
    <button type="button" class="exp on" data-mode="both" id="engRender" title="The picture edit with the finished mix">Audio + video: MP4</button>
  </div>
  <div class="bar" id="instruments"><label>Samples</label></div>
  <div class="ops mix" id="mixer"></div>
  <div class="bar" id="soundBar"><label>Sound</label></div>
  <div id="soundPanel" hidden></div>
  <div class="ops" id="ops"></div>
  <div class="bars" id="bars"></div>
</section>

<section class="bank" id="bank" hidden>
  <div class="bankhead"><span class="big">Slice bank</span><span class="small" id="bankInfo"></span></div>
  <div class="bar" id="filters"></div>
  <div class="bar pager">
    <button type="button" id="pagePrev">Prev page</button>
    <button type="button" id="pageNext">Next page</button>
    <span class="small" id="pageInfo"></span>
  </div>
  <div class="bar detail">
    <span class="info small" id="selInfo">Click a pad to hear and see it</span>
    <span id="tagBtns" style="display:contents"></span>
    <button type="button" id="lockBtn" disabled>Lock</button>
    <button type="button" id="delBtn" disabled>Delete</button>
  </div>
  <div class="pads" id="pads"></div>
</section>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var vid = $("vid"), logEl = $("log");
  var polling = null, logCount = 0;

  /* milestone 2 state */
  var TAGS = ["KICK", "SNARE", "HAT", "TONAL", "NOISE", "VOCAL"];
  var cur = null;                 // { meta, a (analysis), ov (user changes), sel, filter }
  var trimIn = 0, trimOut = 0;
  var actx = null, asrc = null, stopTimer = null, saveTimer = null;
  var PAGE = 96;                  // pads drawn at once; the rest are reached with Prev/Next page
  var clips = {}, clipWait = {};  // decoded audio per slice, loaded only when a slice is needed

  /* ---- wordmark: scale the type so it fills the full width ------- */
  function fitMark() {
    var box = $("mark"), text = $("markText");
    text.style.fontSize = "200px";
    var room = box.clientWidth - 16;
    text.style.fontSize = Math.floor(200 * room / text.offsetWidth) + "px";
  }
  window.addEventListener("resize", fitMark);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitMark); }
  fitMark();

  /* ---- helpers ---------------------------------------------------- */
  function clock() { return new Date().toTimeString().slice(0, 8); }
  function log(msg, isError, t) {
    var row = document.createElement("div");
    if (isError) { row.className = "e"; }
    var a = document.createElement("span"); a.textContent = t || clock();
    var b = document.createElement("span"); b.textContent = msg;
    row.appendChild(a); row.appendChild(b);
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function fmt(sec) {
    if (!isFinite(sec)) { sec = 0; }
    var m = Math.floor(sec / 60), s = sec - m * 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
  }
  function setStatus(stage, rate, pct) {
    $("stage").textContent = stage;
    $("rate").textContent = rate || "";
    $("fill").style.width = (pct || 0) + "%";
  }
  function api(path, options) {
    return fetch(path, options).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    });
  }
  function offline() { log("Server not reachable. Is start.bat still running?", true); setStatus("Offline"); }

  /* ---- tools ------------------------------------------------------- */
  function loadStatus() {
    api("/api/status").then(function (res) {
      var box = $("tools"); box.textContent = "";
      Object.keys(res.data.tools).forEach(function (name) {
        var info = res.data.tools[name];
        var s = document.createElement("span");
        var label = name === "js-runtime" ? (info.name || "deno") : name;
        s.textContent = info.found ? label : label + " missing";
        if (!info.found) { s.className = "bad"; }
        s.title = info.found ? (info.source + " - " + (info.version || info.path)) : "";
        box.appendChild(s);
      });
      res.data.problems.forEach(function (text) { log(text, true); });
      if (!res.data.problems.length) { log("All tools found."); }
      if (res.data.stale && res.data.stale.length) {       // the server is still running files that have since changed
        log("The server window is running an older version (" + res.data.stale.join(", ") + " changed). " +
            "Close the black window and run start.bat again, or new features will be missing or silent.", true);
        setStatus("Restart needed - see log");
      }
    }).catch(offline);
  }

  /* ---- cache ------------------------------------------------------- */
  function loadCache() {
    api("/api/cache").then(function (res) {
      var box = $("cache"); box.textContent = "";
      if (!res.data.items.length) {
        var none = document.createElement("div"); none.className = "none small";
        none.textContent = "Empty"; box.appendChild(none); return;
      }
      res.data.items.forEach(function (meta) {
        var b = document.createElement("button"); b.type = "button";
        var t = document.createElement("span"); t.textContent = meta.title;
        var d = document.createElement("span"); d.textContent = fmt(meta.duration).slice(0, 5);
        b.appendChild(t); b.appendChild(d);
        b.addEventListener("click", function () { openSource(meta, true); });
        box.appendChild(b);
      });
    }).catch(function () {});
  }

  /* ---- preview ----------------------------------------------------- */
  function openSource(meta, fromCache) {
    vid.src = "/media/" + meta.id + "/source.mp4";
    vid.load();
    $("empty").style.display = "none";
    $("title").textContent = meta.title;
    $("play").disabled = false;
    setStatus(fromCache ? "Opened from cache" : "Done", (meta.bytes / 1048576).toFixed(1) + " MB");
    log((fromCache ? "Opened from cache: " : "Ready: ") + meta.title);

    cur = { meta: meta, a: null, ov: {}, sel: -1, filter: "ALL", view: "source" };
    clips = {}; clipWait = {};
    stopEngine(); eng.edl = null; eng.revCache = {};
    $("engine").hidden = true;
    $("bank").hidden = true;
    trimIn = 0; trimOut = meta.duration; paintTrim();
    ["setIn", "setOut", "clearTrim", "analyze"].forEach(function (id) { $(id).disabled = false; });
    loadAnalysis();
  }
  function togglePlay() {
    if (!vid.currentSrc) { return; }
    stopEngine();
    clearTimeout(stopTimer);
    if (asrc) { try { asrc.stop(); } catch (e) {} asrc = null; }
    vid.muted = false;
    if (vid.paused) { vid.play(); } else { vid.pause(); }
  }
  function paintTransport() {
    $("play").textContent = vid.paused ? "Play" : "Stop";
    $("play").className = "big" + (vid.paused ? "" : " on");
  }
  function paintTime() {
    $("time").textContent = fmt(vid.currentTime) + " / " + fmt(vid.duration).slice(0, 5);
    $("head").style.width = (vid.duration ? vid.currentTime / vid.duration * 100 : 0) + "%";
  }
  $("play").addEventListener("click", togglePlay);
  vid.addEventListener("play", paintTransport);
  vid.addEventListener("pause", paintTransport);
  vid.addEventListener("timeupdate", paintTime);
  vid.addEventListener("loadedmetadata", paintTime);
  vid.addEventListener("error", function () {
    if (vid.currentSrc) { log("The browser could not play this file.", true); }
  });
  $("scrub").addEventListener("click", function (ev) {
    if (!vid.duration) { return; }
    var box = this.getBoundingClientRect();
    vid.currentTime = (ev.clientX - box.left) / box.width * vid.duration;
  });
  document.addEventListener("keydown", function (ev) {
    if (document.activeElement === $("url")) { return; }
    if (document.activeElement && document.activeElement.tagName === "INPUT" && document.activeElement.type === "number") { return; }
    if (ev.code === "Space") { ev.preventDefault(); if (eng.edl) { toggleEngine(); } else { togglePlay(); } return; }
    if (ev.ctrlKey || ev.altKey || ev.metaKey) { return; }
    if (eng.edl && eng.focus === "bars" && eng.sel >= 0) {
      if (ev.code === "KeyR") { regenBar(); return; }
      if (ev.code === "KeyL") { lockBar(); return; }
    }
    if (!cur || !cur.a || cur.sel < 0) { return; }
    if (ev.code === "KeyL") { toggleLock(); }
    else if (ev.code === "Delete") { toggleDelete(); }
    else if (ev.code === "ArrowRight" || ev.code === "ArrowLeft") {
      ev.preventDefault();
      var at = cur.list.indexOf(cur.sel), to = cur.list[at + (ev.code === "ArrowRight" ? 1 : -1)];
      if (at >= 0 && to !== undefined) { showSlice(to); audition(to); }
    }
  });

  /* ---- source: fetch + poll ---------------------------------------- */
  var STAGES = { queued: "Queued", probe: "Asking YouTube", download: "Downloading", merge: "Joining", done: "Done" };
  function poll(id) {
    api("/api/job/" + id).then(function (res) {
      var job = res.data;
      for (; logCount < job.log.length; logCount++) {
        var line = job.log[logCount];
        log(line.msg, line.msg.indexOf("ERROR") === 0, line.t);
      }
      if (job.state === "running") {
        var rate = job.speed ? job.speed + "  ETA " + job.eta : "";
        setStatus((STAGES[job.stage] || job.stage) + " " + Math.floor(job.progress) + "%", rate, job.progress);
        polling = setTimeout(function () { poll(id); }, 400);
        return;
      }
      $("go").disabled = false;
      if (job.state === "done") { openSource(job.meta, false); loadCache(); }
      else { setStatus("Failed - see log"); }
    }).catch(function () { $("go").disabled = false; offline(); });
  }
  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var url = $("url").value.trim();
    if (!url) { return; }
    clearTimeout(polling);
    $("go").disabled = true;
    api("/api/ingest", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: url }) })
      .then(function (res) {
        if (!res.data.ok) { $("go").disabled = false; log(res.data.error, true); setStatus("Rejected - see log"); return; }
        if (res.data.cached) { $("go").disabled = false; openSource(res.data.meta, true); return; }
        logCount = 0;
        setStatus("Queued");
        poll(res.data.id);
      }).catch(function () { $("go").disabled = false; offline(); });
  });

  /* ================= milestone 2: trim, analysis, slice bank ========= */

  /* ---- trim --------------------------------------------------------- */
  function paintTrim() {
    $("setIn").textContent = "In " + fmt(trimIn);
    $("setOut").textContent = "Out " + fmt(trimOut);
  }
  $("setIn").addEventListener("click", function () {
    if (vid.currentTime > trimOut - 1) { log("IN must be at least one second before OUT.", true); return; }
    trimIn = vid.currentTime; paintTrim();
  });
  $("setOut").addEventListener("click", function () {
    if (vid.currentTime < trimIn + 1) { log("OUT must be at least one second after IN.", true); return; }
    trimOut = vid.currentTime; paintTrim();
  });
  $("clearTrim").addEventListener("click", function () {
    if (!cur) { return; }
    trimIn = 0; trimOut = cur.meta.duration; paintTrim();
  });

  /* ---- analysis ----------------------------------------------------- */
  function loadAnalysis() {
    var id = cur.meta.id;
    api("/api/analysis/" + id).then(function (res) {
      if (!cur || cur.meta.id !== id) { return; }
      if (!res.ok) { log("Not analyzed yet. Set IN/OUT if you want a section, then press Analyze."); return; }
      cur.a = res.data.analysis;
      cur.ov = res.data.overrides || {};
      trimIn = cur.a.trim_in; trimOut = cur.a.trim_out; paintTrim();
      clips = {}; clipWait = {}; eng.revCache = {};
      buildBank();
      stopEngine(); $("engine").hidden = false; generate(false);
    }).catch(offline);
  }
  function pollAnalysis(id, seen) {
    api("/api/analyze/job/" + id).then(function (res) {
      var job = res.data;
      for (; seen < job.log.length; seen++) {
        log(job.log[seen].msg, job.log[seen].msg.indexOf("ERROR") === 0, job.log[seen].t);
      }
      if (job.state === "running") {
        setStatus("Analyzing " + Math.floor(job.progress) + "%", "", job.progress);
        setTimeout(function () { pollAnalysis(id, seen); }, 500);
        return;
      }
      $("analyze").disabled = false;
      if (job.state === "done") { setStatus("Analysis done"); if (cur && cur.meta.id === id) { loadAnalysis(); } }
      else { setStatus("Analysis failed - see log"); }
    }).catch(function () { $("analyze").disabled = false; offline(); });
  }
  $("analyze").addEventListener("click", function () {
    if (!cur) { return; }
    var id = cur.meta.id;
    $("analyze").disabled = true;
    api("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({ id: id, trim_in: trimIn, trim_out: trimOut }) })
      .then(function (res) {
        if (!res.data.ok) { $("analyze").disabled = false; log(res.data.error, true); return; }
        if (res.data.cached) {     // nothing to redo, and nothing to reload
          $("analyze").disabled = false;
          log("Already analyzed with these IN/OUT points. Move IN or OUT to analyze a different section.");
          if (!cur.a) { loadAnalysis(); }
          return;
        }
        setStatus("Analyzing 0%");
        pollAnalysis(id, 0);
      }).catch(function () { $("analyze").disabled = false; offline(); });
  });

  /* ---- slice audio ---------------------------------------------------
     Each slice is fetched from the server as its own tiny WAV the first time
     it is needed, then kept. The page never holds the whole song in memory. */
  function loadClip(i) {
    if (clips[i]) { return Promise.resolve(clips[i]); }
    if (clipWait[i]) { return clipWait[i]; }
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    var id = cur.meta.id, made = cur.a.made;
    clipWait[i] = fetch("/media/" + id + "/slice/" + i + ".wav?v=" + encodeURIComponent(made))
      .then(function (r) { if (!r.ok) { throw new Error(); } return r.arrayBuffer(); })
      .then(function (bytes) { return actx.decodeAudioData(bytes); })
      .then(function (buf) {
        if (cur && cur.meta.id === id && cur.a && cur.a.made === made) { clips[i] = buf; delete clipWait[i]; }
        return buf;
      }, function (err) { delete clipWait[i]; throw err; });
    return clipWait[i];
  }

  /* ---- slice helpers ------------------------------------------------- */
  function ovOf(i) { return cur.ov[i] || (cur.ov[i] = { tag: "", locked: false, deleted: false }); }
  function peek(i) { return cur.ov[i] || { tag: "", locked: false, deleted: false }; }
  function tagOf(i) { return peek(i).tag || cur.a.slices[i].tag; }
  function visible(i) {
    if (cur.filter === "ALL") { return true; }
    if (cur.filter === "LOCKED") { return peek(i).locked; }
    return tagOf(i) === cur.filter && !peek(i).deleted;
  }
  function padEl(i) { return cur.els ? cur.els[i] : null; }
  function num4(i) { var t = String(i); while (t.length < 4) { t = "0" + t; } return t; }
  function saveSoon() {
    clearTimeout(saveTimer);
    var id = cur.meta.id, body = JSON.stringify({ overrides: cur.ov });
    saveTimer = setTimeout(function () {
      fetch("/api/slices/" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: body })
        .catch(function () { log("Could not save slice changes.", true); });
    }, 400);
  }

  /* ---- build the bank ------------------------------------------------ */
  function drawWave(canvas, env, colour) {
    var g = canvas.getContext("2d"), w = canvas.width / env.length, mid = canvas.height / 2;
    g.fillStyle = colour;
    for (var k = 0; k < env.length; k++) {
      var h = Math.max(1, env[k] / 255 * canvas.height);
      g.fillRect(Math.round(k * w), Math.round(mid - h / 2), Math.ceil(w) - 1, Math.round(h));
    }
  }
  function paintPad(i) {
    var el = padEl(i), o = peek(i);
    if (!el) { return; }                                   // not on the page being shown
    el.className = "pad" + (o.locked ? " locked" : "") + (o.deleted ? " del" : "") + (i === cur.sel ? " sel" : "");
    el.lastChild.lastChild.textContent = tagOf(i);
  }
  /* Only one page of pads exists at a time, so the browser never has to
     lay out or paint more than PAGE of them, however long the video is. */
  function renderPads() {
    var a = cur.a, th = a.thumbs, pads = $("pads"), colour = getComputedStyle(document.body).color;
    cur.list = [];
    for (var i = 0; i < a.slices.length; i++) { if (visible(i)) { cur.list.push(i); } }
    cur.pages = Math.max(1, Math.ceil(cur.list.length / PAGE));
    cur.page = Math.max(0, Math.min(cur.pages - 1, cur.page || 0));
    cur.els = {};
    pads.textContent = "";
    var frag = document.createDocumentFragment();
    cur.list.slice(cur.page * PAGE, (cur.page + 1) * PAGE).forEach(function (i) {
      var s = a.slices[i];
      var pad = document.createElement("button"); pad.type = "button"; pad.dataset.i = i;
      var pic = document.createElement("span"); pic.className = "th";
      if (th) {
        var n = Math.max(0, Math.min(th.count - 1, Math.floor((s.start - a.trim_in) * th.fps)));
        pic.style.backgroundSize = (th.cols * th.w) + "px " + (th.rows * th.h) + "px";
        pic.style.backgroundPosition = (-(n % th.cols) * th.w) + "px " + (-Math.floor(n / th.cols) * th.h) + "px";
      }
      var cv = document.createElement("canvas"); cv.width = 96; cv.height = 22;
      drawWave(cv, s.env, colour);
      var lab = document.createElement("span"); lab.className = "lab";
      var a1 = document.createElement("span"); a1.textContent = num4(i);
      var a2 = document.createElement("span");
      lab.appendChild(a1); lab.appendChild(a2);
      pad.appendChild(pic); pad.appendChild(cv); pad.appendChild(lab);
      frag.appendChild(pad);
      cur.els[i] = pad;
    });
    pads.appendChild(frag);
    Object.keys(cur.els).forEach(function (i) { paintPad(+i); });
    var first = cur.list.length ? cur.page * PAGE + 1 : 0, last = Math.min(cur.list.length, (cur.page + 1) * PAGE);
    $("pageInfo").textContent = "Page " + (cur.page + 1) + " / " + cur.pages + "  /  showing " + first + " to " + last + " of " + cur.list.length;
    $("pagePrev").disabled = cur.page <= 0;
    $("pageNext").disabled = cur.page >= cur.pages - 1;
  }
  function showSlice(i) {                                   // turn to the page that holds slice i
    var at = cur.list.indexOf(i);
    if (at >= 0 && Math.floor(at / PAGE) !== cur.page) { cur.page = Math.floor(at / PAGE); renderPads(); }
  }
  $("pagePrev").addEventListener("click", function () { if (cur && cur.a) { cur.page--; renderPads(); } });
  $("pageNext").addEventListener("click", function () { if (cur && cur.a) { cur.page++; renderPads(); } });
  function paintFilters() {
    var counts = { ALL: cur.a.slices.length, LOCKED: 0 };
    TAGS.forEach(function (t) { counts[t] = 0; });
    cur.a.slices.forEach(function (s) {
      var o = peek(s.i);
      if (o.locked) { counts.LOCKED++; }
      if (!o.deleted) { counts[tagOf(s.i)] = (counts[tagOf(s.i)] || 0) + 1; }
    });
    var box = $("filters"); box.textContent = "";
    ["ALL"].concat(TAGS, ["LOCKED"]).forEach(function (name) {
      var b = document.createElement("button"); b.type = "button";
      b.textContent = name + " " + counts[name];
      if (cur.filter === name) { b.className = "on"; }
      b.addEventListener("click", function () {
        cur.filter = name; cur.page = 0; paintFilters(); renderPads();
      });
      box.appendChild(b);
    });
  }
  function paintDetail() {
    var i = cur.sel, has = i >= 0;
    $("lockBtn").disabled = !has; $("delBtn").disabled = !has;
    var box = $("tagBtns"); box.textContent = "";
    if (!has) { $("selInfo").textContent = "Click a pad to hear and see it"; return; }
    var s = cur.a.slices[i], o = peek(i);
    $("selInfo").textContent = "#" + num4(i) + "  /  " + fmt(s.start) + "  /  " + Math.round((s.end - s.start) * 1000) +
      " ms  /  note " + s.note + "  /  " + Math.round(s.centroid) + " Hz  /  level " + Math.round(s.rms * 100);
    TAGS.forEach(function (t) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = t;
      if (tagOf(i) === t) { b.className = "on"; }
      b.addEventListener("click", function () {
        ovOf(i).tag = t === s.tag ? "" : t;
        paintPad(i); paintFilters(); paintDetail(); saveSoon();
      });
      box.appendChild(b);
    });
    $("lockBtn").className = o.locked ? "on" : "";
    $("lockBtn").textContent = o.locked ? "Locked" : "Lock";
    $("delBtn").className = o.deleted ? "on" : "";
    $("delBtn").textContent = o.deleted ? "Restore" : "Delete";

  function select(i) {
    var old = cur.sel; cur.sel = i;
    if (old >= 0) { paintPad(old); }
    paintPad(i); paintDetail();
  }
  function toggleLock() {
    var i = cur.sel; if (i < 0) { return; }
    var o = ovOf(i); o.locked = !o.locked; if (o.locked) { o.deleted = false; }
    paintPad(i); paintFilters(); paintDetail(); saveSoon();
  }
  function toggleDelete() {
    var i = cur.sel; if (i < 0) { return; }
    var o = ovOf(i);
    if (o.locked) { log("Slice #" + num4(i) + " is locked. Unlock it before deleting."); return; }
    o.deleted = !o.deleted;
    paintPad(i); paintFilters(); paintDetail(); saveSoon();
  }
  $("lockBtn").addEventListener("click", toggleLock);
  $("delBtn").addEventListener("click", toggleDelete);

  function buildBank() {
    var a = cur.a, id = cur.meta.id;
    cur.sel = -1; cur.filter = "ALL"; cur.page = 0;
    $("bankInfo").textContent = a.slices.length + " slices  /  " + a.bpm.toFixed(1) + " BPM  /  " +
      a.scene_cuts.length + " scene cuts  /  " + fmt(a.trim_in) + " to " + fmt(a.trim_out);
    $("pads").style.setProperty("--sprite", a.thumbs ? "url(/media/" + id + "/thumbs.jpg?v=" + encodeURIComponent(a.made) + ")" : "none");
    renderPads(); paintFilters(); paintDetail();
    $("bank").hidden = false;
  }
  $("pads").addEventListener("click", function (ev) {
    var pad = ev.target.closest(".pad");
    if (pad) { eng.focus = "bank"; audition(+pad.dataset.i); }
  });

  /* ---- audition: hear the slice and see the same moment -------------- */
  function audition(i) {
    var s = cur.a.slices[i], dur = s.end - s.start;
    stopEngine();
    select(i);
    if (asrc) { try { asrc.stop(); } catch (e) {} asrc = null; }
    loadClip(i).then(function (buf) {
      if (!cur || cur.sel !== i || eng.playing) { return; }      // moved on while it loaded
      if (actx.state === "suspended") { actx.resume(); }
      if (asrc) { try { asrc.stop(); } catch (e) {} }
      asrc = actx.createBufferSource();
      asrc.buffer = buf;
      asrc.connect(actx.destination);
      asrc.start();
    }).catch(function () { log("Could not load the audio for slice #" + num4(i) + ".", true); });
    clearTimeout(stopTimer);
    showSourceVideo();
    vid.pause(); vid.muted = true; vid.currentTime = s.start;
    var playing = vid.play();
    if (playing && playing.catch) { playing.catch(function () {}); }
    stopTimer = setTimeout(function () { vid.pause(); }, Math.max(120, dur * 1000));
  }

  /* ================= milestone 3: break engine ====================== */
  /* The arrangement is an EDIT DECISION LIST (eng.edl): plain data, every
     event fully spelled out (which slice, when, how long, pitch, reverse).
     The live preview below plays it; the offline render (milestone 7) will
     read the same list, so what you hear is what gets exported.
     All times inside the list are in BEATS, so changing BPM needs no regenerate. */

  var OPS = [
    { id: "ratchet",  name: "Ratchet",      def: 35 },
    { id: "swap",     name: "Shuffle-swap", def: 40 },
    { id: "displace", name: "Displace",     def: 15 },
    { id: "reverse",  name: "Reverse",      def: 15 },
    { id: "tail",     name: "Pitch-tail",   def: 20 },
    { id: "stretch",  name: "Stretch",      def: 8 },
    { id: "stutter",  name: "Gate-stutter", def: 15 },
    { id: "meter",    name: "Meter break",  def: 0 }
  ];
  var METERS = [{ n: "7/8", steps: 14 }, { n: "5/4", steps: 20 }, { n: "7/4", steps: 28 }, { n: "11/8", steps: 22 }];
  var LANES = { KICK: 0, SNARE: 1, TONAL: 1, HAT: 2 };
  /* Song form: the bars are split into six sections, in these proportions. Each has its own density. */
  var FORM = [
    { name: "INTRO",     tag: "IN",  share: 2, level: 0.2 },    // tonal slices, stretched, sparse
    { name: "BUILD",     tag: "BLD", share: 2, level: 0.45 },   // break creeps in
    { name: "DROP A",    tag: "A",   share: 4, level: 1.0 },    // full break
    { name: "INTERLUDE", tag: "INT", share: 2, level: 0.15 },   // sudden near-silence
    { name: "DROP B",    tag: "B",   share: 4, level: 1.35 },   // heavier, odd meters, more ratchets
    { name: "OUTRO",     tag: "OUT", share: 2, level: 0.8 }     // collapse into a smear
  ];
  function sectionOf(n, total) {
    if (!eng.form) { return { sec: FORM[2], pos: 0, last: false }; }
    var edge = 0;
    for (var k = 0; k < FORM.length; k++) {
      var start = Math.round(edge / 16 * total); edge += FORM[k].share;
      var end = Math.round(edge / 16 * total);
      if (n < end || k === FORM.length - 1) { return { sec: FORM[k], pos: (n - start) / Math.max(1, end - start), last: n === end - 1 }; }
    }
  }
  var eng = { bpm: 174, seed: 1, nbars: 16, intensity: 60, ops: {}, edl: null, sel: -1, focus: "bank",
              playing: false, timer: null, next: 0, nextTime: 0, live: [], marks: [], shown: -1,
              revCache: {}, master: null, hann: null, form: true, voices: { sub: true }, mute: { SYNTH: true, DRUMS: true }, bus: null, kit: {}, kitWait: {}, kitCount: null, inp: {}, post: {}, fx: {}, crushReady: false, curves: {}, ir: null, snd: {}, open: null,
              mix: { samples: 100, instruments: 100, master: 100, SUB: 100, REESE: 100, BOX: 100, ACID: 100, SYNTH: 100, DRUMS: 100 } };
  /* MIXER. Three group levels and one level per instrument, each 0..150 where 100 leaves the sound as generated.
     Samples = the chopped video audio itself (kick, snare, hat, tonal slices). Instruments = Sub bass, Reese,
     Music box, Acid (made from the source) and the optional Synth layer. Master = everything, before the limiter.
     Saved in the edit list as "mix"; render.py applies the same numbers with the same curve (level()). */
  var MIXER = [["samples", "Samples", "Volume of the chopped video audio: the kick, snare, hat and tonal slices"],
               ["instruments", "Instruments", "Volume of all instruments together: sub bass, reese, music box, acid, synth and added drums"],
               ["master", "Master", "Volume of the complete mix. It sits before the limiter, so turning it up cannot clip"],
               ["SUB", "Sub bass", ""], ["REESE", "Reese", ""], ["BOX", "Music box", ""], ["ACID", "Acid", ""],
               ["SYNTH", "Synth", "Volume of the optional oscillator layer"],
               ["DRUMS", "Added drums", "Volume of the optional added drum kit"]];
  var MASTER_TRIM = 0.8;                                                                   // must match render.py
  function level(p) {                                                                      // must match render.py
    p = Math.max(0, Math.min(150, p === undefined || p === null || isNaN(+p) ? 100 : +p));
    return p * p / 10000;                         // squared: 50 is a quarter (-12 dB), 150 is 2.25 times (+7 dB)
  }
  var INSTRUMENTS = [["KICK", "Kick"], ["SNARE", "Snare"], ["HAT", "Hat"], ["TONAL", "Tonal"], ["SUB", "Sub bass"],
                     ["REESE", "Reese"], ["BOX", "Music box"], ["ACID", "Acid"], ["SYNTH", "Synth"], ["DRUMS", "Added drums"]];
  /* Bass, Reese, Music box and Acid are made FROM THE SOURCE: a chosen slice, re-pitched, stands in for the oscillator
     and goes through the same filters and envelopes. The plain oscillators are an optional extra (the Synth switch, off
     by default). SRC_BASE: the note, in semitones above the root, at which a voice's slice plays at its tuned rate. */
  var SRC_BASE = { SUB: 0, REESE: 12, ACID: 24, BOX: 36 };
  var SUB_SRC_CUTOFF = 200;                                                                // must match render.py
  /* ACID: saw into two lowpass filters in a row (24 dB/octave), cutoff snapping from PEAK down to BASE.  must match render.py */
  var ACID_BASE = 280, ACID_PEAK = 2200, ACID_ACCENT = 2, ACID_DECAY = 0.16, ACID_Q = 8,
      ACID_GLIDE = 0.04, ACID_ATTACK = 0.003, ACID_RELEASE = 0.012;
  var ACID_SCALE = [0, 0, 0, 3, 7, 10, 12, 12, -2];                                        // mostly root and octave
  var BOX_ATTACK = 0.002, BOX_THIRD_MIX = 0.25, BOX_FLOOR = 0.01;                          // must match render.py
  var REESE_CENTS = 14, REESE_CUTOFF = 500, REESE_ATTACK = 0.01, REESE_RELEASE = 0.04;     // must match render.py
  var BOX_SCALE = [0, 3, 5, 7, 10, 12, 15];                                                // minor pentatonic over the root
  var NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  var SUB_GLIDE = 0.06, SUB_ATTACK = 0.005, SUB_RELEASE = 0.03, SUB_OCTAVE_MIX = 0.3;   // must match render.py
  /* SOUND PANELS. One per source-made instrument: [key, label, lowest, highest, step, default, unit, log slider?].
     The defaults are the sound as it was before the panels existed. The values are saved in the edit list as "snd"
     (plus on: false while a panel is bypassed) and read at playback, so changing them never touches the notes.
     They shape the SOURCE-MADE instrument only; the Synth layer's oscillators keep the default sound.
     The same table, with the same limits and defaults, is SND in render.py. */
  var SND = {
    SUB:   [["oct", "Octave", -2, 1, 1, 0, ""], ["tune", "Tune", -12, 12, 1, 0, "st"], ["cut", "Cutoff", 60, 2000, 1, 200, "Hz", true],
            ["res", "Resonance", 0, 24, 1, 0, "dB"], ["drive", "Drive", 0, 100, 1, 0, ""], ["len", "Length", 10, 100, 1, 100, "%"]],

    BOX:   [["tune", "Tune", -24, 24, 1, 0, "st"], ["att", "Attack", 2, 200, 1, 2, "ms", true], ["dec", "Decay", 10, 100, 1, 100, "%"],
            ["bright", "Brightness", 300, 16000, 1, 16000, "Hz", true], ["dist", "Distortion", 0, 100, 1, 0, ""]],
    ACID:  [["cut", "Cutoff", 80, 2000, 1, 360, "Hz", true], ["res", "Resonance", 0, 24, 1, 11, "dB"], ["env", "Envelope", 0, 200, 1, 120, "%"],
            ["dec", "Decay", 20, 600, 1, 200, "ms", true], ["acc", "Accent", 0, 200, 1, 100, "%"], ["slide", "Slide", 0, 200, 1, 40, "ms"]]
  };

        join.connect(lp);
        [[e.rate * spread, near, far], [e.rate / spread, far, near]].forEach(function (copy) {
          var both = actx.createGain(), split = actx.createChannelSplitter(2), left = actx.createGain(), right = actx.createGain();
          both.channelCount = 2; both.channelCountMode = "explicit"; both.channelInterpretation = "speakers";   // mono slices play in both speakers
          left.gain.value = copy[1]; right.gain.value = copy[2];
          both.connect(split); split.connect(left, 0); split.connect(right, 1); left.connect(join, 0, 0); right.connect(join, 0, 1);
          src(copy[0], copy[0], 0, both);
        });
        return;
      }
      osc("sawtooth", f * spread, 0.5, lp); osc("sawtooth", f / spread, 0.5, lp);
      return;
    }
    if (e.voice !== "SUB") { return; }
    if (dur < SUB_ATTACK + SUB_RELEASE) { return; }
    var amp = actx.createGain(), ring = clip ? P.res : 0;
    fades(amp.gain, e.g * Math.pow(10, -ring / 40), SUB_ATTACK, SUB_RELEASE);
    driven(amp, P.drive).connect(desk);
    if (clip) {                            // the slice pitched down, through a lowpass: bass made from the source
      var low = lowpass(P.cut, ring), shift = Math.pow(2, P.oct + P.tune / 12);
      low.connect(amp);
      src((e.rate0 || e.rate) * shift, e.rate * shift, SUB_GLIDE, low);                                   // portamento
      return;
    }
    var f0 = e.from === undefined ? f : 440 * Math.pow(2, (e.from - 69) / 12);
    [[1, 1], [2, SUB_OCTAVE_MIX]].forEach(function (part) {      // sine plus a quieter sine one octave up
      var tone = osc("sine", f0 * part[0], part[1], amp);
      if (f0 !== f) { tone.frequency.exponentialRampToValueAtTime(f * part[0], when + SUB_GLIDE); }          // portamento
    });
  }
  /* Added drum kit. Written twice with the same sums: here, and in render.py (the added-drums block).
     Each hit plays one sample from the drumnbasskit folder: peak brought to 1, times the drum's fixed level, the
     hit's own level and the panel level. Kick and snare can be tuned (played faster or slower). A hit plays to the
     end of its sample, except an open hat with a length (d), which the next hat cuts off. */
  function scheduleDrum(d, barTime, spb) {
    if (eng.mute.DRUMS || !DRUM_PICK[d.drum]) { return; }
    var P = sound("DRUMS"), n = P[DRUM_PICK[d.drum]], hit = eng.kit[d.drum + n];
    if (!hit) { loadDrum(d.drum, n).catch(function () {}); return; }          // not loaded yet: skip this once
    var g = d.g * DRUM_G[d.drum] * level(P[DRUM_LEVEL[d.drum]]) * hit.norm, when = barTime + d.t * spb;
    if (!(g > 0)) { return; }
    var node = actx.createBufferSource(), amp = actx.createGain();
    node.buffer = hit.buf; amp.gain.setValueAtTime(g, when);
    node.playbackRate.value = Math.pow(2, (d.drum === "K" ? P.ktune : d.drum === "S" ? P.sst : 0) / 12);
    node.connect(amp); amp.connect(eng.inp.DRUMS);
    node.start(when);
    if (d.d !== undefined) {                                                   // cut off by the next hat
      var end = when + d.d * spb;
      amp.gain.setValueAtTime(g, end); amp.gain.linearRampToValueAtTime(0, end + DRUM_CHOKE);
      node.stop(end + DRUM_CHOKE + 0.005);
    }
    eng.live.push(node);
    node.onended = function () { var k = eng.live.indexOf(node); if (k >= 0) { eng.live.splice(k, 1); } amp.disconnect(); };
  }
  function tick() {
    var bars = eng.edl.bars, spb = 60 / eng.bpm;
    while (eng.nextTime < actx.currentTime + 0.25) {
      var bar = bars[eng.next % bars.length], at = eng.nextTime;
      bar.events.forEach(function (e) { scheduleEvent(e, at, spb); });
      (bar.synth || []).forEach(function (e) { playNote(e, at, spb); });
      (bar.drums || []).forEach(function (d) { scheduleDrum(d, at, spb); });
      eng.marks.push({ k: eng.next % bars.length, at: at });
      eng.nextTime += bar.beats * spb;
      eng.next++;
    }
  }
  function followBar() {
    if (!eng.playing) { return; }
    var now = actx.currentTime, k = eng.shown;
    while (eng.marks.length && eng.marks[0].at <= now) { k = eng.marks.shift().k; }
    if (k !== eng.shown) {
      var cells = $("bars").children;
      if (cells[eng.shown]) { cells[eng.shown].classList.remove("now"); }
      if (cells[k]) { cells[k].classList.add("now"); }
      eng.shown = k;
    }
    requestAnimationFrame(followBar);
  }
  function startEngine() {
    if (!eng.edl || eng.starting) { return; }
    eng.starting = true;
    loadKit().then(function () { eng.starting = false; startNow(); },
                   function () { eng.starting = false; log("Could not load the slices for the break.", true); });
  }
  function startNow() {
    if (!eng.edl || eng.playing) { return; }
    clearTimeout(stopTimer); vid.pause();
    if (asrc) { try { asrc.stop(); } catch (e) {} asrc = null; }
    if (actx.state === "suspended") { actx.resume(); }
    buildBus();
    eng.playing = true; eng.next = eng.sel >= 0 ? eng.sel : 0; eng.nextTime = actx.currentTime + 0.08; eng.marks = [];
    tick(); eng.timer = setInterval(tick, 25);
    $("engPlay").textContent = "Stop"; $("engPlay").className = "on";
    requestAnimationFrame(followBar);
  }
  function stopEngine() {
    if (!eng.playing) { return; }
    eng.playing = false; clearInterval(eng.timer);
    eng.live.slice().forEach(function (n) { try { n.stop(); } catch (e) {} });
    eng.live = []; eng.marks = [];
    var cells = $("bars").children; if (cells[eng.shown]) { cells[eng.shown].classList.remove("now"); }
    eng.shown = -1;
    $("engPlay").textContent = "Play"; $("engPlay").className = "";
  }
  function toggleEngine() { if (eng.playing) { stopEngine(); } else { startEngine(); } }

  /* ---- render: send the edit list to the server, get an MP4 back ------- */
  function showSourceVideo() {
    if (!cur || cur.view === "source") { return; }
    cur.view = "source";
    vid.src = "/media/" + cur.meta.id + "/source.mp4"; vid.load();
    $("title").textContent = cur.meta.title;
  }
  /* ---- export: audio only, silent video, or both. One job on the server, the same edit list for all three ---- */
  var EXPORT_NAMES = { audio: "Audio export", video: "Video export (silent)", both: "Audio + video export" };
  function exportButtons(off) {
    Array.prototype.forEach.call(document.querySelectorAll(".exp"), function (b) { b.disabled = off; });
  }
  function pollRender(id, seen, mode) {
    api("/api/render/job/" + id).then(function (res) {
      var job = res.data;
      for (; seen < job.log.length - (job.state === "running" ? 1 : 0); seen++) {
        log(job.log[seen].msg, job.log[seen].msg.indexOf("ERROR") === 0, job.log[seen].t);
      }
      if (job.state === "running") {
        var last = job.log.length ? job.log[job.log.length - 1].msg : "";
        setStatus(EXPORT_NAMES[mode] + " " + Math.floor(job.progress) + "%", last, job.progress);
        setTimeout(function () { pollRender(id, seen, mode); }, 400);
        return;
      }
      exportButtons(false);
      if (job.state !== "done") { setStatus(EXPORT_NAMES[mode] + " failed - see log"); return; }
      var r = job.result, file = r.mp4 || r.wav;
      setStatus(EXPORT_NAMES[mode] + " done", r.seconds + " s" + (r.drift_ms === null ? "" : "  /  drift " + r.drift_ms + " ms"));
      log(EXPORT_NAMES[mode] + " saved in the renders folder: " + file +
          " (plus " + (r.mp4 && r.wav ? ".wav, " : "") + ".edl.json, .log.txt)");
      if (cur && cur.meta.id === id) {              // show (or play) the result in the preview screen
        stopEngine();
        cur.view = "render";
        vid.src = "/renders/" + file; vid.load(); vid.muted = false;
        $("title").textContent = "EXPORT  /  " + file + (mode === "audio" ? "  (sound only)" : mode === "video" ? "  (silent)" : "");
        window.scrollTo(0, 0);
        var playing = vid.play(); if (playing && playing.catch) { playing.catch(function () {}); }
      }
    }).catch(function () { exportButtons(false); offline(); });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".exp"), function (button) {
    button.addEventListener("click", function () {
      if (!eng.edl || !cur) { return; }
      readParams(); eng.edl.bpm = eng.bpm;
      var id = cur.meta.id, mode = button.dataset.mode;
      exportButtons(true);
      stopEngine();
      api("/api/render", { method: "POST", headers: { "Content-Type": "application/json" },
                           body: JSON.stringify({ edl: eng.edl, mode: mode }) })
        .then(function (res) {
          if (!res.data.ok) { exportButtons(false); log(res.data.error, true); return; }
          log(EXPORT_NAMES[mode] + " started.");
          setStatus(EXPORT_NAMES[mode] + " 0%");
          pollRender(id, 0, mode);
        }).catch(function () { exportButtons(false); offline(); });
    });
  });

  /* ---- light / dark ---------------------------------------------------- */
  function showTheme() { $("theme").textContent = document.documentElement.dataset.theme === "dark" ? "Light" : "Dark"; }
  $("theme").addEventListener("click", function () {
    var dark = document.documentElement.dataset.theme !== "dark";
    if (dark) { document.documentElement.dataset.theme = "dark"; } else { delete document.documentElement.dataset.theme; }
    try { localStorage.setItem("breakshredder-theme", dark ? "dark" : "light"); } catch (e) {}
    showTheme();
    if (cur && cur.a) { renderPads(); }             // waveforms and bar drawings are painted in the text colour:
    if (eng.edl) { paintBars(); }                   // redraw the one page of pads and the bars in the new colour
  });
  showTheme();

  window.BREAKSHREDDER = { edl: function () { return eng.edl; } };   // for inspection in the browser console
  buildOps();
  buildMixer();
  buildSound();
  loadKitList();
  loadStatus();
  loadCache();
})();
</script>
</body>
